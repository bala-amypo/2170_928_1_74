# ===============================
# APPLICATION CONFIG
# ===============================
# CHANGED PORT TO 8081 TO AVOID CONFLICT
server.port=9001
spring.application.name=insurance-fraud-pattern-detector

# Allow bean definition overriding (Critical for your JWT/Security setup)
spring.main.allow-bean-definition-overriding=true

# ===============================
# H2 DATABASE
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# H2 CONSOLE
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT SETTINGS
# ===============================
jwt.secret=SuperSecretJwtKeyForDemoProject123
jwt.expiration=3600000